version: 2

sources:
  - name: bronze
    description: >
      The Delta table written by the Spark bronze job. dbt reads it through
      DuckDB's delta_scan() rather than copying it — one storage layer, and
      the same table Databricks would read in production.
    meta:
      # dbt-duckdb swaps {{ source('bronze', 'posts') }} for this expression.
      external_location: "delta_scan('{{ var('bronze_posts_path') }}')"
    tables:
      - name: posts
        description: Raw posts, one row per Stack Exchange post. 26,764 rows.

[project]
name = "dataflow"
version = "0.1.0"
description = "Medallion lakehouse over the ai.stackexchange.com data dump"
requires-python = ">=3.12"
dependencies = [
    "pyspark==4.1.1",
    "delta-spark==4.2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

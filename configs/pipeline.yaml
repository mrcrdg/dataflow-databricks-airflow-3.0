# Pipeline configuration.
#
# Read by dataflow.common.config. Paths and table names must not be hardcoded
# in Python — if a job needs a new knob, it goes here.

spark:
  app_name: dataflow
  warehouse_dir: ./spark-warehouse

bronze:
  posts:
    source_path: data/ai.stackexchange.com/Posts.xml
    row_tag: row
    table: bronze.posts
    # Bronze is a full refresh of the raw dump: the source is a static
    # archive, so there is nothing to load incrementally. No dbt model
    # downstream is incremental either.
    write_mode: overwrite

  users:
    source_path: data/ai.stackexchange.com/Users.xml
    row_tag: row
    table: bronze.users
    write_mode: overwrite
